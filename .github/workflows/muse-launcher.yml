name: Muse portable launcher

'on':
  workflow_dispatch:
  push:
    branches: [codex/muse-pivot-20261010]
    paths:
      - official_muse/integrated_release/**
      - .github/workflows/muse-launcher.yml

permissions:
  contents: read

jobs:
  launcher:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the shared package and repository launcher
        run: |
          sh -n official_muse/integrated_release/launch_muse.sh
          python3 -m py_compile official_muse/integrated_release/build_host.py official_muse/integrated_release/prepare_bundle.py official_muse/integrated_release/package_app.py
          python3 official_muse/integrated_release/test_launcher.py -v
      - name: Validate signed package resource and entry preservation
        working-directory: official_muse/integrated_release
        run: python3 test_package.py -v
