<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>text{font-family:-apple-system,'PingFang SC',sans-serif;fill:#e9edef}.title{font-size:48px;font-weight:600}.h{font-size:32px;font-weight:600}.b{font-size:25px;fill:#bbc2c9}.s{font-size:22px;fill:#9da7b0}.accent{fill:#92d5cf}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#92d5cf"/></marker></defs>
<rect width="1600" height="900" fill="#181d22"/>
<text x="80" y="100" class="title">AI 负责理解，本地端负责行动。</text>
<text x="80" y="150" class="b">Muse · 个人智能 Agent　｜　同一核心，端云协同</text>
<rect x="80" y="206" width="430" height="454" rx="24" fill="#262d34"/>
<text x="112" y="266" class="h">云端 AI</text><text x="112" y="320" class="s">通过官方 model.complete</text>
<text x="112" y="390" class="b">自然语言理解</text><text x="112" y="444" class="b">事项与意图提取</text><text x="112" y="498" class="b">候选方案生成</text><text x="112" y="552" class="b">回复草拟</text><text x="112" y="622" class="s">不直接取得系统权限或凭据</text>
<rect x="580" y="206" width="440" height="454" rx="24" fill="#262d34"/>
<text x="612" y="266" class="h">本地 Muse Agent</text><text x="612" y="332" class="b">相关长期记忆 · 来源与归属</text><text x="612" y="386" class="b">事项关联 · 计划 · 任务状态</text><text x="612" y="440" class="b">本地校验 · 用户确认</text><text x="612" y="494" class="b">恢复 · 防重复</text><text x="612" y="572" class="s">保存结果与可核验来源</text><text x="612" y="622" class="s">不把模型文本当执行成功</text>
<rect x="1090" y="206" width="430" height="454" rx="24" fill="#263433"/>
<text x="1122" y="266" class="h">OctoSense Runtime</text><text x="1122" y="332" class="b">权限 · Secret 隔离</text><text x="1122" y="386" class="b">Mail Host · EventKit 日历</text><text x="1122" y="440" class="b">官方 Storage · 真实执行</text><text x="1122" y="494" class="b">独立读取核对</text><text x="1122" y="572" class="s">邮箱 / 日历 / 存储 / 系统</text><text x="1122" y="622" class="s">配套本地日历扩展</text>
<path d="M510 424H566M1020 424H1076" stroke="#92d5cf" stroke-width="3" marker-end="url(#arrow)"/>
<text x="80" y="750" class="h accent">AI 提案 → 本地校验 → 用户决定 → 本地执行 → 系统回读 → 结果反馈</text>
<text x="80" y="821" class="s">密码与模型密钥保留在宿主；模型输出不直接触发外部动作。发信、改日历等动作按确认规则执行。</text>
</svg>
